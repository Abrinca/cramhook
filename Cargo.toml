[package]
name = "cramhook"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Abrinca/cramhook"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rust-htslib = { version = "1.0.2", default-features = false, features = ["bzip2", "lzma", "libdeflate"] }
# MIT; Rust port of PILER-CR (`qc --crispr` array detection).
pilercr-rs = "0.2"

# musl's allocator is slow under many threads; only the static musl release build uses mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
